@if (alert(); as a) {
    <div
        class="panel-alert"
        [class.is-expiry]="a.expiry"
        role="dialog"
        aria-modal="true"
        aria-labelledby="panelAlertTitle"
    >
        <div class="panel-alert__card">
            <h2 class="panel-alert__title" id="panelAlertTitle">{{ a.title }}</h2>
            @if (a.message.trim()) {
                <p class="panel-alert__message">{{ a.message }}</p>
            }
            @if (images().length) {
                <!-- every image loads at once (stacked): the change never leaves the box empty -->
                <div class="panel-alert__images">
                    @for (src of images(); track $index) {
                        <img
                            class="panel-alert__image"
                            [class.is-shown]="$index === imageIndex()"
                            [src]="src"
                            alt=""
                        />
                    }
                </div>
            }
            <button
                #okButton
                type="button"
                class="panel-alert__button"
                (click)="close()"
            >
                {{ a.button || ('MPX.COMMON.OK' | translate) }}
            </button>
        </div>
    </div>
}

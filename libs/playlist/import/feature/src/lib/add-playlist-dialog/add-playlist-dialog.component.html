<div class="apd">
    <div mat-dialog-title class="apd-head">
        <h2 class="apd-title">Añadir Conexión</h2>
        <p class="apd-sub">Ingresa tus credenciales de acceso</p>
    </div>

    <mat-dialog-content>
        <div class="apd-form-area">
            <!-- Carga directa y exclusiva del formulario Xtream Codes -->
            <app-xtream-code-import (addClicked)="closeDialog()" />
        </div>
    </mat-dialog-content>

    <mat-dialog-actions class="apd-actions">
        <div class="apd-actions__reset">
            <button
                mat-button
                type="button"
                [disabled]="isClearDisabled()"
                (click)="clearCurrentForm()"
            >
                Limpiar
            </button>
        </div>

        <div class="apd-actions__decision">
            <button mat-button type="button" (click)="closeDialog()">
                Cancelar
            </button>

            <button
                mat-stroked-button
                type="button"
                [disabled]="!xtreamImport()?.form?.valid || xtreamImport()?.isTestingConnection"
                (click)="xtreamImport()?.testConnection()"
            >
                {{ xtreamImport()?.isTestingConnection ? 'Probando...' : 'Probar Conexión' }}
            </button>
            <button
                mat-flat-button
                color="primary"
                type="button"
                [disabled]="!xtreamImport()?.form?.valid"
                (click)="xtreamImport()?.addPlaylist()"
            >
                Conectar
            </button>
        </div>
    </mat-dialog-actions>
</div>
